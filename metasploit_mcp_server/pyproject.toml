[project]
name = "metasploit-mcp-server"
version = "0.1.0"
description = "Hardened Metasploit Framework RPC client + MCP server (msf_* tools) for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "msgpack>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff", "mypy"]

[project.scripts]
msf-mcp-server = "metasploit_mcp.server:main"

[tool.setuptools]
packages = ["metasploit_mcp"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "msf_live: tests that need a running msfrpcd (set MSF_LIVE=1; skipped by default)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
# lenient per repo conventions
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
